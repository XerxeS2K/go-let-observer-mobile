name: Android Touch Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_API: 21

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go (from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages (platform + build-tools + NDK)
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Install Ebiten gomobile
        run: |
          go install github.com/ebitengine/gomobile/cmd/gomobile@latest
          gomobile init

      - name: Build Android Debug APK (with debug output)
        run: |
          set -euxo pipefail

          echo "=== GIT SHA ==="
          git rev-parse HEAD

          echo "=== android folder listing ==="
          ls -la ./android

          echo "=== android/gomobile_app.go (first 40 lines) ==="
          sed -n '1,40p' ./android/gomobile_app.go || true

          echo "=== go env (key vars) ==="
          go env | egrep 'GOOS|GOARCH|GOMOD|GOWORK|CGO_ENABLED' || true

          echo "=== go list for ./android with -tags=mobile ==="
          go list -tags=mobile -f 'ImportPath={{.ImportPath}}' ./android
          go list -tags=mobile -f 'GoFiles={{.GoFiles}}' ./android
          go list -tags=mobile -f 'IgnoredGoFiles={{.IgnoredGoFiles}}' ./android
          go list -tags=mobile -f 'Imports={{.Imports}}' ./android

          echo "=== gomobile build ==="
          gomobile build \
            -target=android \
            -androidapi=${ANDROID_API} \
            -tags=mobile \
            -o app-debug.apk \
            ./android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app-debug.apk
